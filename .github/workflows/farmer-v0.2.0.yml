name: Package farmer v0.2.0
on:
  push:
    branches: [release/farmer-v0.2.0]
permissions:
  contents: write
concurrency: farmer-v0.2.0-release
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 42460efdee1118542e64cd8fda46838589a585ed
      - name: Build and check Windows package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/lean/bin output/lean/lib/lean output/python tools
          godot_base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fSL --retry 3 "$godot_base/Godot_v4.6.3-stable_linux.x86_64.zip" -o tools/godot.zip
          curl -fSL --retry 3 "$godot_base/Godot_v4.6.3-stable_export_templates.tpz" -o tools/templates.tpz
          unzip -q tools/godot.zip -d tools
          godot="$PWD/tools/Godot_v4.6.3-stable_linux.x86_64"
          templates="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$templates"
          unzip -p tools/templates.tpz templates/windows_release_x86_64.exe > "$templates/windows_release_x86_64.exe"
          touch tools/.gdignore output/.gdignore
          "$godot" --headless --path . --export-release 'Windows 64' "$PWD/output/farmer.exe"
          curl -fSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-windows.zip -o tools/lean.zip
          unzip -q tools/lean.zip '*/bin/lean.exe' '*/bin/*shared*.dll' '*/lib/lean/*.olean' '*/LICENSE*' -d tools
          lean=tools/lean-4.19.0-windows
          cp "$lean"/bin/{lean.exe,libInit_shared.dll,libleanshared.dll,libleanshared_1.dll} output/lean/bin/
          cp "$lean"/LICENSE* output/lean/
          cp -R "$lean"/lib/lean/{Init,Lean,Std,Init.olean,Lean.olean,Std.olean} output/lean/lib/lean/
          curl -fSL --retry 3 https://api.nuget.org/v3-flatcontainer/python/3.12.10/python.3.12.10.nupkg -o tools/python.nupkg
          unzip -q tools/python.nupkg 'tools/python*.exe' 'tools/python*.dll' 'tools/vcruntime*.dll' 'tools/DLLs/*' 'tools/Lib/*' 'tools/LICENSE.txt' -d tools/python
          cp -a tools/python/tools/. output/python/
          test -s output/python/python.exe
          test -s output/python/Lib/http/server.py
          cp README.md output/开始游戏.md
          cp LICENSE assets/FONT-LICENSE.txt output/
          test "$(tail -c 4 output/farmer.exe)" = GDPC
          (cd output && zip -qr -3 ../farmer-Windows-x64.zip farmer.exe lean python 开始游戏.md LICENSE FONT-LICENSE.txt)
          unzip -tq farmer-Windows-x64.zip
      - name: Attach and publish existing prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
          gh release upload v0.2.0 farmer-Windows-x64.zip --repo "$GITHUB_REPOSITORY"
          gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx farmer-Windows-x64.zip
          gh release edit v0.2.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
